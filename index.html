<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Francisco Weather App</title>
    <!-- Link to our external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container to hold all weather content -->
    <div class="container">
        <!-- Header section -->
        <header>
            <h1>🌉 San Francisco Weather</h1>
            <p>Current weather conditions in the City by the Bay</p>
        </header>

        <!-- Weather display card -->
        <div class="weather-card">
            <!-- This div shows while data is being loaded -->
            <div id="loading" class="loading">
                Loading weather data...
            </div>

            <!-- This div is hidden initially and shows when data is loaded -->
            <div id="weather-info" class="weather-info" style="display: none;">
                <!-- Weather icon from OpenWeatherMap -->
                <img id="weather-icon" src="" alt="Weather icon" class="weather-icon">

                <!-- Main temperature display -->
                <div class="temperature">
                    <span id="temp">--</span>°F
                </div>

                <!-- Weather description (e.g., "Clear sky") -->
                <div class="description">
                    <span id="description">--</span>
                </div>

                <!-- Additional weather details in a grid -->
                <div class="details">
                    <div class="detail-item">
                        <span class="label">Feels Like</span>
                        <span id="feels-like">--</span>°F
                    </div>
                    <div class="detail-item">
                        <span class="label">Humidity</span>
                        <span id="humidity">--</span>%
                    </div>
                    <div class="detail-item">
                        <span class="label">Wind Speed</span>
                        <span id="wind">--</span> mph
                    </div>
                </div>
            </div>

            <!-- Error message (hidden by default) -->
            <div id="error" class="error" style="display: none;">
                <p>⚠️ Unable to load weather data.</p>
                <p class="error-detail">Please check your API key in app.js</p>
            </div>
        </div>

        <!-- Footer with info -->
        <footer>
            <p>Data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
            <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
        </footer>
    </div>

    <!-- Link to our JavaScript file (placed at end so HTML loads first) -->
    <script src="app.js"></script>
</body>
</html>
